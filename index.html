<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOI Builder</title>
<style>
  :root {
    --navy: #0F172A;
    --accent: #2563EB;
    --accent-ink: #FFFFFF;
    --card: #F7FAFF;
    --card-border: #D7E1F5;
    --gray: #59616B;
    --bg: #FDFEFF;
    --danger: #DC2626;
    --danger-bg: #FEF2F2;
    --success: #15803D;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --navy: #E7ECF7;
      --accent: #5B8DFF;
      --accent-ink: #0B1220;
      --card: #16213A;
      --card-border: #29365A;
      --gray: #9AA6BF;
      --bg: #0B1220;
      --danger: #F87171;
      --danger-bg: #2A1518;
      --success: #4ADE80;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 92px;
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--card-border);
  }
  header.topbar h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.topbar button.text-btn {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 4px;
    cursor: pointer;
  }
  header.topbar button.text-btn:active { color: var(--danger); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .templates-menu {
    position: relative;
  }
  .templates-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 4px;
    cursor: pointer;
  }
  .templates-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 200px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 9px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    z-index: 30;
    overflow: hidden;
  }
  .templates-dropdown.show { display: block; }
  .templates-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--navy);
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 14px;
    cursor: pointer;
  }
  .templates-dropdown button:active { background: var(--bg); }
  .templates-dropdown button + button { border-top: 1px solid var(--card-border); }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }

  section.block {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray);
    margin: 0 0 12px;
  }

  label.field {
    display: block;
    margin-bottom: 12px;
  }
  label.field:last-child { margin-bottom: 0; }
  label.field span.label-text {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 5px;
  }
  input[type="text"], select, textarea {
    width: 100%;
    font-size: 16px;
    font-family: inherit;
    color: var(--navy);
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 11px;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="text"]:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  input.err, select.err {
    outline: 2px solid var(--danger);
    outline-offset: 1px;
  }
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--gray) 50%), linear-gradient(135deg, var(--gray) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(1em + 2px), calc(100% - 13px) calc(1em + 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }

  .option-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .option-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
  }
  .option-head input.opt-label {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
    background: none;
    border: none;
    color: var(--navy);
    padding: 4px 2px;
    min-width: 0;
  }
  .option-head input.opt-label:focus { outline: none; border-bottom: 1px solid var(--accent); }

  .switch {
    position: relative;
    width: 42px;
    height: 25px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--card-border);
    border-radius: 999px;
    transition: background .15s;
  }
  .switch .track::before {
    content: "";
    position: absolute;
    height: 19px; width: 19px;
    left: 3px; top: 3px;
    background: var(--bg);
    border-radius: 50%;
    transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(17px); }

  .option-body {
    padding: 0 16px 16px;
    border-top: 1px solid var(--card-border);
  }
  .option-body { padding-top: 14px; }
  .option-card.off .option-body { display: none; }
  .option-card.off { opacity: 0.6; }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
  }
  .fields-grid label.field.span-2 { grid-column: 1 / -1; }

  .unit-hint {
    font-size: 11px;
    color: var(--gray);
    margin-top: 3px;
  }

  .term-input-row {
    display: flex;
    gap: 6px;
    align-items: stretch;
  }
  .term-input-row input { flex: 1; min-width: 0; }
  .unit-toggle {
    display: flex;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .unit-toggle button {
    background: var(--bg);
    border: none;
    color: var(--gray);
    font-size: 11px;
    font-weight: 700;
    padding: 0 11px;
    cursor: pointer;
  }
  .unit-toggle button + button { border-left: 1px solid var(--card-border); }
  .unit-toggle button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .computed-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 11px;
  }
  .computed-value.pending {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gray);
  }

  .why-block { margin-top: 14px; }
  .why-add {
    display: flex;
    gap: 8px;
  }
  .why-add input { flex: 1; }
  .why-add button {
    flex-shrink: 0;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 20px;
    line-height: 1;
    width: 42px;
    cursor: pointer;
  }
  ul.why-list {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  ul.why-list li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 13.5px;
  }
  ul.why-list li span { flex: 1; }
  ul.why-list li button {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 15px;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
  }
  ul.why-list li button:active { color: var(--danger); }

  .uw-toggle {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--accent);
    font-weight: 700;
    font-size: 12.5px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .uw-panel {
    margin-top: 10px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .uw-headline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--card-border);
  }
  .uw-headline .k {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .uw-headline .v {
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
  }
  .uw-details-toggle {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 700;
    font-size: 12px;
    padding: 4px 0;
    cursor: pointer;
    text-align: left;
  }
  .uw-details { margin-top: 8px; }
  .uw-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .uw-row:last-child { border-bottom: none; }
  .uw-row .k { color: var(--gray); }
  .uw-row .v { font-weight: 700; text-align: right; }
  .uw-note {
    font-size: 11px;
    color: var(--gray);
    margin-top: 8px;
    line-height: 1.45;
  }

  .error-banner {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 13.5px;
    display: none;
  }
  .error-banner.show { display: block; }
  .error-banner ul { margin: 6px 0 0; padding-left: 18px; }

  .json-out {
    width: 100%;
    min-height: 140px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    resize: vertical;
  }

  footer.actions {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    background: var(--bg);
    border-top: 1px solid var(--card-border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .actions-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  button.primary {
    flex: 1;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 9px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:active { opacity: 0.85; }
  .status-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--success);
    min-width: 64px;
    text-align: right;
    opacity: 0;
    transition: opacity .2s;
  }
  .status-text.show { opacity: 1; }

  .help-note {
    font-size: 12px;
    color: var(--gray);
    line-height: 1.5;
    margin: 4px 0 0;
  }

  .result-block {
    background: var(--danger-bg);
    border: 1px solid var(--success);
    background: rgba(21,128,61,0.08);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
    font-size: 13.5px;
    display: none;
  }
  .result-block.show { display: block; }
  .result-block a {
    display: block;
    color: var(--accent);
    font-weight: 700;
    margin-top: 6px;
    word-break: break-all;
  }
  button.secondary {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 4px;
    cursor: pointer;
  }
  button.primary[disabled] { opacity: 0.6; }
</style>
</head>
<body>

<header class="topbar">
  <h1>LOI Builder</h1>
  <div class="topbar-right">
    <div class="templates-menu" id="templatesMenu">
      <button class="templates-btn" id="templatesBtn" type="button">Templates ▾</button>
      <div class="templates-dropdown" id="templatesDropdown"></div>
    </div>
    <button class="text-btn" id="clearBtn" type="button">Clear</button>
  </div>
</header>

<main>
  <div class="error-banner" id="errorBanner">
    <strong>Fix before sending:</strong>
    <ul id="errorList"></ul>
  </div>

  <div class="result-block" id="resultBlock">
    <strong>LOI sent to Drive.</strong>
    <a id="slidesLink" href="#" target="_blank" rel="noopener">Open Slides →</a>
    <a id="pdfLink" href="#" target="_blank" rel="noopener">Open PDF →</a>
  </div>

  <section class="block">
    <p class="eyebrow">Deal</p>
    <label class="field">
      <span class="label-text">Property Address</span>
      <input type="text" id="propertyAddress" placeholder="123 Main St, City, ST">
    </label>
    <div class="row-2">
      <label class="field">
        <span class="label-text">Purchased From</span>
        <input type="text" id="purchasedFrom" placeholder="Seller name">
      </label>
      <label class="field">
        <span class="label-text">Purchased By</span>
        <input type="text" id="purchasedBy" placeholder="Buyer / entity">
      </label>
    </div>
  </section>

  <p class="eyebrow" style="padding-left:4px;">Purchase Options</p>
  <div id="optionsContainer"></div>

  <p class="help-note" style="padding:0 4px 8px;">
    Fill in the options you want on the LOI (up to 8 — 5+ spill onto a second options page in the deck), then tap Send to Drive. No copy/paste, no Claude Code needed.
  </p>
</main>

<footer class="actions">
  <div class="actions-inner">
    <button class="secondary" id="copyBtn" type="button">Copy JSON</button>
    <button class="primary" id="sendBtn" type="button">Send to Drive</button>
    <span class="status-text" id="statusText">Sent ✓</span>
  </div>
</footer>

<script>
const STRUCTURE_FIELDS = {
  cash: [
    { key: "price", label: "Price", type: "money" }
  ],
  seller_finance: [
    { key: "price", label: "Price", type: "money" },
    { key: "down", label: "Down Payment", type: "money" },
    { key: "length", label: "Term", type: "months" },
    { key: "balloon", label: "Balloon", type: "months" },
    { key: "rate", label: "Interest Rate", type: "rate" }
  ],
  subject_to: [
    { key: "existing_balance", label: "Existing Loan Balance", type: "money" },
    { key: "existing_rate", label: "Existing Rate", type: "rate" },
    { key: "existing_remaining_term", label: "Existing Loan Remaining Term (optional)", type: "months" },
    { key: "piti", label: "Monthly PITI", type: "money" },
    { key: "cash_to_seller", label: "Cash to Seller", type: "money" }
  ],
  hybrid: [
    { key: "existing_balance", label: "Existing Loan Balance", type: "money" },
    { key: "existing_rate", label: "Existing Rate", type: "rate" },
    { key: "existing_remaining_term", label: "Existing Loan Remaining Term (optional)", type: "months" },
    { key: "piti", label: "Monthly PITI", type: "money" },
    { key: "carry_amount", label: "Seller Carry Amount", type: "money" },
    { key: "carry_rate", label: "Carry Rate", type: "rate" },
    { key: "carry_length", label: "Carry Term", type: "months" },
    { key: "carry_balloon", label: "Carry Balloon", type: "months" },
    { key: "cash_to_seller", label: "Cash to Seller", type: "money" }
  ],
  seller_carryback: [
    { key: "price", label: "Price", type: "money" },
    { key: "new_loan_amount", label: "New First Mortgage Amount (down payment to seller)", type: "money" },
    { key: "carry_amount", label: "Seller Carry Amount (2nd position)", type: "money" },
    { key: "carry_rate", label: "Carry Rate", type: "rate" },
    { key: "carry_length", label: "Carry Term", type: "months" },
    { key: "carry_balloon", label: "Carry Balloon", type: "months" }
  ]
};
// Optional extra fields for seller_carryback -- only required/sent when that
// option's "Include First Mortgage Terms" toggle is on. David: needed for
// offers going to an investor, where the first-position loan's own terms
// matter to the reader (unlike a normal seller offer, where they don't).
// first_mortgage_payment is NOT collected here -- it's calculated from
// new_loan_amount + rate + term (see calcFirstMortgagePayment) so the
// number is always internally consistent, not hand-typed.
const FIRST_MORTGAGE_EXTRA_FIELDS = [
  { key: "first_mortgage_rate", label: "First Mortgage Rate", type: "rate" },
  { key: "first_mortgage_length", label: "First Mortgage Term", type: "months" }
];
const STRUCTURE_LABELS = {
  cash: "Cash",
  seller_finance: "Seller Finance",
  subject_to: "Subject-To",
  hybrid: "Hybrid",
  seller_carryback: "Seller Carry Back"
};
const UNIT_HINT = { money: "e.g. 200,000 (auto-formats to $)", rate: "number only, no %", months: "number of months" };

const MAX_OPTIONS = 8;

// loi_builder backend, reachable only over David's tailnet -- see
// Core/skills/loi_builder/server.py + run_local.py. This page is public
// (GitHub Pages), but that's fine: the URL only answers to devices on the
// tailnet, so there's nothing here worth hiding. The PIN below is a second,
// cheap layer on top of that -- unlike the abandoned Apps Script design,
// it is a REAL secret (it also gates the endpoint if the tailnet ACL were
// ever misconfigured), so it is never hardcoded in this public source. It's
// entered once and kept in this browser's localStorage only.
const BACKEND_URL = "https://nexus.taild9a970.ts.net/loi/generate";
const PIN_STORAGE_KEY = "loi_builder_pin";

function getPin() {
  return localStorage.getItem(PIN_STORAGE_KEY) || "";
}

function defaultOption(i) {
  return {
    on: i === 0,
    label: "Option " + (i + 1),
    structure: "cash",
    fields: {},
    units: {},
    why: [],
    includeFirstMortgageTerms: false,
    showUnderwriting: false,
    showUnderwritingDetails: false
  };
}

// Fields that don't block Send even when left blank -- underwriting math
// degrades gracefully (see computeUnderwriting) rather than requiring input
// the deal itself might not need.
const OPTIONAL_TERM_FIELDS = new Set(["existing_remaining_term"]);

// Term/balloon fields (type "months") can be entered in months or years --
// the entered number is reinterpreted, not just relabeled, when the unit is
// switched (30 "mo" -> 2.5 "yr", not 30 "yr"), and always converts back to
// months before hitting the backend (execution.py's _fmt_months always
// renders "N mo" -- months is the wire format regardless of input unit).
function fieldUnit(opt, key) { return (opt.units && opt.units[key]) || "years"; }
function monthsOf(opt, key) {
  const raw = pn(opt.fields[key]);
  return fieldUnit(opt, key) === "years" ? raw * 12 : raw;
}
function roundUnitValue(v, unit) { return unit === "years" ? Math.round(v * 100) / 100 : Math.round(v); }

// First mortgage payment is always derived, never hand-typed -- see
// FIRST_MORTGAGE_EXTRA_FIELDS. Returns null if there's not yet enough
// input (term) to compute anything.
function calcFirstMortgagePayment(opt) {
  const fmLoan = pm(opt.fields.new_loan_amount);
  const fmRate = pn(opt.fields.first_mortgage_rate);
  const fmTerm = monthsOf(opt, "first_mortgage_length");
  if (!fmTerm) return null;
  return { loan: fmLoan, rate: fmRate, term: fmTerm, payment: tranchePaymentM(fmLoan, fmRate, fmTerm) };
}

let state = {
  property_address: "",
  purchased_from: "",
  purchased_by: "",
  options: Array.from({length: MAX_OPTIONS}, (_, i) => defaultOption(i))
};

function saveDraft() {}

function formatMoney(raw) {
  const trimmed = (raw || "").trim();
  if (!trimmed) return "N/A";
  const digits = trimmed.replace(/[^0-9.]/g, "");
  if (!digits) return "N/A";
  const num = parseFloat(digits);
  if (isNaN(num)) return "N/A";
  return "$" + num.toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function moneyDisplayValue(raw) {
  if (!raw || raw === "N/A") return "";
  return raw.replace(/^\$/, "");
}

// Prebuilt option templates. Each `apply(askingPrice)` returns 4 option
// objects (see defaultOption shape) that overwrite state.options[0..3].
// Ladder locked in 2026-09-29 (see Core memory: project_loi_builder.md) --
// reverse-engineered from a real LOI (140 Senora PL) and confirmed as the
// standing default: cash anchors low to make the other 3 look better by
// contrast, price scales up as seller concessions (rate, balloon) do.
function roundTo(n, nearest) { return Math.round(n / nearest) * nearest; }

const TEMPLATES = {
  seller_finance_menu: {
    label: "Seller Finance Menu",
    apply(asking) {
      const cash = roundTo(asking * 0.65, 1000);
      const base = roundTo(asking * 1.00, 1000);
      const premium = roundTo(asking * 1.23, 1000);
      const carryTotal = roundTo(asking * 1.05, 1000);
      const carryHalf = roundTo(carryTotal / 2, 500);

      return [
        {
          on: true, label: "Option 1 — Cash", structure: "cash",
          fields: { price: formatMoney(String(cash)) },
          why: [
            "Quick close (10 days). As-is purchase. No inspection. No buyer concessions.",

function escapeAttr(s) { return (s || "").replace(/"/g, "&quot;"); }
function escapeHtml(s) { return (s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// ---- Underwriting math (mirrors execution/re_wholesaling/underwriting_instruments.html,
// terms in months not years since that's how this form already collects them) ----

function pm(raw) {
  if (!raw) return 0;
  const n = parseFloat(String(raw).replace(/[^0-9.-]/g, ""));
  return isFinite(n) ? n : 0;
}
const pn = pm;

function tranchePaymentM(principal, ratePct, termMonths) {
  const r = (ratePct || 0) / 100 / 12;
  const n = termMonths;
  if (!n || n <= 0) return 0;
  if (r <= 0) return principal / n;
  return principal * r / (1 - Math.pow(1 + r, -n));
}

function remainingBalanceM(principal, ratePct, termMonths, monthsElapsed) {
  const r = (ratePct || 0) / 100 / 12;
  const n = termMonths;
  const k = Math.max(0, Math.min(monthsElapsed, n));
  if (!n || n <= 0) return principal;
  if (r <= 0) return Math.max(0, principal - (principal / n) * k);
  const payment = tranchePaymentM(principal, ratePct, n);
  const bal = principal * Math.pow(1 + r, k) - payment * ((Math.pow(1 + r, k) - 1) / r);
  return Math.max(0, bal);
}

function loanStatsM(principal, ratePct, termMonths, balloonMonths) {
  const payment = tranchePaymentM(principal, ratePct, termMonths);
  const totalInterestFullTerm = termMonths > 0 ? (payment * termMonths - principal) : 0;
  const k = balloonMonths > 0 ? Math.min(balloonMonths, termMonths) : termMonths;
  const paidToBalloon = payment * k;
  const payoff = remainingBalanceM(principal, ratePct, termMonths, k);
  const totalInterestToBalloon = paidToBalloon - (principal - payoff);
  const allIn = paidToBalloon + payoff;
  const fullyAmortized = termMonths > 0 && k >= termMonths;
  return { payment, totalInterestFullTerm, paidToBalloon, payoff, totalInterestToBalloon, allIn, fullyAmortized };
}

function uwRow(label, value) { return { label, value }; }
function mm(n) { return formatMoney(String(Math.round(n))); }

// First-payment principal/interest split -- the split shifts every month on
// an amortizing loan, so "the" P&I breakdown is inherently a month-1 snapshot,
// not a constant. Labeled as such in every row that uses it.
function splitPI(balance, ratePct, payment) {
  const interest = balance * ((ratePct || 0) / 100 / 12);
  const principal = Math.max(0, payment - interest);
  return { interest, principal };
}
function piBreakdownRows(prefix, balance, ratePct, payment) {
  const s = splitPI(balance, ratePct, payment);
  return [
    uwRow(`${prefix} — Principal (Month 1)`, mm(s.principal)),
    uwRow(`${prefix} — Interest (Month 1)`, mm(s.interest))
  ];
}

// Returns { headline: {label,value}|null, pendingNote, rows, note }.
// headline is the single "combined monthly payment" figure shown as soon as
// the underwriting panel opens; everything else (breakdowns, balloon,
// interest, all-in totals) sits in `rows`, revealed only behind the
// panel's own "Show Details" sub-toggle.
function computeUnderwriting(opt) {
  const f = opt.fields;

  if (opt.structure === "cash") {
    return { headline: null, pendingNote: "Cash offer — no financing to underwrite.", rows: [], note: "" };
  }

  if (opt.structure === "seller_finance") {
    const price = pm(f.price), down = pm(f.down), rate = pn(f.rate), term = monthsOf(opt, "length"), balloon = monthsOf(opt, "balloon");
    const principal = Math.max(0, price - down);
    if (!term) return { headline: null, pendingNote: "Enter a term to compute payment math.", rows: [], note: "" };
    const s = loanStatsM(principal, rate, term, balloon);
    return {
      headline: { label: "Monthly Payment", value: mm(s.payment) },
      rows: [
        uwRow("Financed Principal", mm(principal)),
        ...piBreakdownRows("Monthly Payment", principal, rate, s.payment),
        uwRow("Balloon Payoff Due", s.fullyAmortized ? "$0 (fully amortized)" : mm(s.payoff)),
        uwRow("Total Interest to Balloon", mm(s.totalInterestToBalloon)),
        uwRow("Total Interest at Full Term", mm(s.totalInterestFullTerm)),
        uwRow("All-In Total at Balloon", mm(s.allIn))
      ],
      note: "Payment = amortizing P&I on the financed principal (price − down) at the stated rate/term. Principal/interest split shifts every month as the loan pays down — shown here is month 1. Balloon payoff is the remaining balance owed at the balloon date."
    };
  }

  if (opt.structure === "subject_to" || opt.structure === "hybrid") {
    const balance = pm(f.existing_balance), exRate = pn(f.existing_rate), remTerm = monthsOf(opt, "existing_remaining_term"), piti = pm(f.piti);
    const rows = [];
    let note;
    if (!remTerm) {
      note = "Enter the existing loan's remaining term to break this out into real principal/interest instead of just the stated PITI.";
    } else {
      const pAndI = tranchePaymentM(balance, exRate, remTerm);
      const totalInterest = pAndI * remTerm - balance;
      rows.push(uwRow("Existing Note — Computed P&I", mm(pAndI)));
      rows.push(...piBreakdownRows("Existing Note", balance, exRate, pAndI));
      rows.push(uwRow("Existing Note — Stated PITI", mm(piti)));
      rows.push(uwRow("Existing Note — Total Interest (Remaining Term)", mm(totalInterest)));
      rows.push(uwRow("Existing Note — Payoff at Term End", "$0 (fully amortizing)"));
      note = "Computed P&I is principal+interest only on the existing balance/rate/remaining term — stated PITI runs higher if it includes taxes/insurance.";
    }

    let headlineValue = piti;
    let headlineLabel = "Monthly Payment (Stated PITI)";
    if (opt.structure === "hybrid") {
      const carryAmt = pm(f.carry_amount), carryRate = pn(f.carry_rate), carryTerm = monthsOf(opt, "carry_length"), carryBalloon = monthsOf(opt, "carry_balloon");
      if (carryTerm) {
        const cs = loanStatsM(carryAmt, carryRate, carryTerm, carryBalloon);
        rows.push(uwRow("Seller Carry — Monthly Payment", mm(cs.payment)));
        rows.push(...piBreakdownRows("Seller Carry", carryAmt, carryRate, cs.payment));
        rows.push(uwRow("Seller Carry — Balloon Payoff Due", cs.fullyAmortized ? "$0 (fully amortized)" : mm(cs.payoff)));
        rows.push(uwRow("Seller Carry — Total Interest to Balloon", mm(cs.totalInterestToBalloon)));
        rows.push(uwRow("Seller Carry — All-In Total at Balloon", mm(cs.allIn)));
        headlineValue = piti + cs.payment;
        headlineLabel = "Combined Monthly Payment (PITI + Carry)";
      } else {
        rows.push(uwRow("Seller Carry", "Enter a carry term to compute payment math."));
      }
    }
    rows.push(uwRow("Cash to Seller (stated)", mm(pm(f.cash_to_seller))));
    return { headline: { label: headlineLabel, value: mm(headlineValue) }, rows, note };
  }

  if (opt.structure === "seller_carryback") {
    const carryAmt = pm(f.carry_amount), carryRate = pn(f.carry_rate), carryTerm = monthsOf(opt, "carry_length"), carryBalloon = monthsOf(opt, "carry_balloon");
    const rows = [];
    let combinedMonthly = 0;
    if (opt.includeFirstMortgageTerms) {
      const calc = calcFirstMortgagePayment(opt);
      if (!calc) {
        rows.push(uwRow("1st Mortgage", "Enter a term to calculate the payment."));
      } else {
        const fmTotalInterest = calc.payment * calc.term - calc.loan;
        rows.push(uwRow("1st Mortgage — Monthly Payment (calculated)", mm(calc.payment)));
        rows.push(...piBreakdownRows("1st Mortgage", calc.loan, calc.rate, calc.payment));
        rows.push(uwRow("1st Mortgage — Total Interest (Full Term)", mm(fmTotalInterest)));
        combinedMonthly += calc.payment;
      }
    } else {
      rows.push(uwRow("1st Mortgage", "Toggle \"Include First Mortgage Terms\" to add its payment to the combined total."));
    }
    let headline = null, pendingNote;
    if (carryTerm) {
      const s = loanStatsM(carryAmt, carryRate, carryTerm, carryBalloon);
      rows.push(uwRow("Seller Carry (2nd) — Monthly Payment", mm(s.payment)));
      rows.push(...piBreakdownRows("Seller Carry (2nd)", carryAmt, carryRate, s.payment));
      rows.push(uwRow("Seller Carry (2nd) — Balloon Payoff Due", s.fullyAmortized ? "$0 (fully amortized)" : mm(s.payoff)));
      rows.push(uwRow("Seller Carry (2nd) — Total Interest to Balloon", mm(s.totalInterestToBalloon)));
      rows.push(uwRow("Seller Carry (2nd) — Total Interest at Full Term", mm(s.totalInterestFullTerm)));
      rows.push(uwRow("Seller Carry (2nd) — All-In Total at Balloon", mm(s.allIn)));
      combinedMonthly += s.payment;
      headline = {
        label: opt.includeFirstMortgageTerms ? "Combined Monthly Payment (1st + 2nd)" : "Monthly Payment (Carry Only)",
        value: mm(combinedMonthly)
      };
    } else {
      rows.push(uwRow("Seller Carry (2nd)", "Enter a carry term to compute payment math."));
      pendingNote = "Enter the seller carry term to compute a combined monthly payment.";
    }
    return {
      headline,
      pendingNote,
      rows,
      note: "1st mortgage payment is a calculated amortized P&I off its own rate/term/loan amount, same as seller carry (2nd) — both are real amortizations, not stated figures."
    };
  }

  return { headline: null, pendingNote: "", rows: [], note: "" };
}

function renderUnderwritingPanel(opt, idx) {
  const result = computeUnderwriting(opt);
  let html = "";
  if (result.headline) {
    html += `<div class="uw-headline"><span class="k">${escapeHtml(result.headline.label)}</span><span class="v">${escapeHtml(result.headline.value)}</span></div>`;
  } else if (result.pendingNote) {
    html += `<div class="uw-note" style="margin-top:0;">${escapeHtml(result.pendingNote)}</div>`;
  }
  if (result.rows.length) {
    html += `<button type="button" class="uw-details-toggle" data-role="uw-details-toggle" data-idx="${idx}">${opt.showUnderwritingDetails ? "Hide Details ▲" : "Show Details ▼"}</button>`;
    if (opt.showUnderwritingDetails) {
      const rowsHtml = result.rows.map(r =>
        `<div class="uw-row"><span class="k">${escapeHtml(r.label)}</span><span class="v">${escapeHtml(r.value)}</span></div>`
      ).join("");
      const noteHtml = result.note ? `<div class="uw-note">${escapeHtml(result.note)}</div>` : "";
      html += `<div class="uw-details">${rowsHtml}${noteHtml}</div>`;
    }
  }
  return html;
}

container.addEventListener("click", e => {
  const addBtn = e.target.closest('[data-role="why-add"]');
  if (addBtn) {
    const idx = +addBtn.dataset.idx;
    const input = container.querySelector(`[data-role="why-input"][data-idx="${idx}"]`);
    const val = input.value.trim();
    if (val) {
      state.options[idx].why.push(val);
      input.value = "";
      saveDraft();
      renderOptions();
    }
    return;
  }
  const delBtn = e.target.closest('[data-role="why-del"]');
  if (delBtn) {
    const idx = +delBtn.dataset.idx, bidx = +delBtn.dataset.bidx;
    state.options[idx].why.splice(bidx, 1);
    saveDraft();
    renderOptions();
    return;
  }
  const uwBtn = e.target.closest('[data-role="uw-toggle"]');
  if (uwBtn) {
    const idx = +uwBtn.dataset.idx;
    state.options[idx].showUnderwriting = !state.options[idx].showUnderwriting;
    renderOptions();
    return;
  }
  const uwDetailsBtn = e.target.closest('[data-role="uw-details-toggle"]');
  if (uwDetailsBtn) {
    const idx = +uwDetailsBtn.dataset.idx;
    state.options[idx].showUnderwritingDetails = !state.options[idx].showUnderwritingDetails;
    renderOptions();
    return;
  }
  const unitBtn = e.target.closest('[data-role="unit-btn"]');
  if (unitBtn) {
    const idx = +unitBtn.dataset.idx, key = unitBtn.dataset.key, newUnit = unitBtn.dataset.unit;
    const opt = state.options[idx];
    const oldUnit = fieldUnit(opt, key);
    if (newUnit !== oldUnit) {
      const rawVal = pn(opt.fields[key]);
      if (rawVal) {
        const months = oldUnit === "years" ? rawVal * 12 : rawVal;
        const converted = newUnit === "years" ? months / 12 : months;
        opt.fields[key] = String(roundUnitValue(converted, newUnit));
      }
      opt.units = opt.units || {};
      opt.units[key] = newUnit;
      saveDraft();
      renderOptions();
    }
  }
});

container.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.role === "why-input") {

container.addEventListener("change", e => {
  const t = e.target;
  const idx = +t.dataset.idx;
  if (t.dataset.role === "toggle") {
    state.options[idx].on = t.checked;
    saveDraft();
    renderOptions();
  } else if (t.dataset.role === "structure") {
    state.options[idx].structure = t.value;
    state.options[idx].fields = {};
    state.options[idx].units = {};
    state.options[idx].includeFirstMortgageTerms = false;
    saveDraft();
    renderOptions();
  } else if (t.dataset.role === "fmt-toggle") {
    state.options[idx].includeFirstMortgageTerms = t.checked;
    saveDraft();
    renderOptions();
  } else if (t.dataset.role === "term") {
    const key = t.dataset.key, type = t.dataset.type;
    let val = t.value;
    if (type === "money") val = formatMoney(val);
    state.options[idx].fields[key] = val;
    saveDraft();
    // Always re-render (this fires on blur/Enter, not per keystroke) so an
    // open underwriting panel picks up the new value immediately.
    renderOptions();
  }
});

  document.getElementById("propertyAddress").value = "";
  document.getElementById("purchasedFrom").value = "";
  document.getElementById("purchasedBy").value = "";
  hideError();
  hideResult();
  renderOptions();
});

function hideError() {
  document.getElementById("errorBanner").classList.remove("show");
}
function showError(problems) {
  const list = document.getElementById("errorList");
  list.innerHTML = "";
  problems.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p;
    list.appendChild(li);
  });
  document.getElementById("errorBanner").classList.add("show");
  document.getElementById("errorBanner").scrollIntoView({ behavior: "smooth", block: "start" });
}

// Resolves one field's payload value: money defaults to "N/A", months
// fields convert from whatever unit the user picked back to months (the
// only unit the backend understands), everything else is a trimmed string.
// Pushes a "required" problem for empty non-money/non-optional fields.
function resolveFieldValue(opt, f, problems) {
  const raw = opt.fields[f.key];
  if (f.type === "money") return raw || "N/A";
  if (f.type === "months") {
    const trimmed = (raw || "").trim();
    if (!trimmed) {
      if (!OPTIONAL_TERM_FIELDS.has(f.key)) problems.push(`"${opt.label}": ${f.label} is required`);
      return "N/A";
    }
    // Send the number with whichever unit is actually selected on this
    // field (e.g. "30 yr" or "18 mo") instead of collapsing to a month
    // count -- the generated LOI card should show what was picked, not a
    // silently-converted equivalent. execution.py's _fmt_months passes a
    // pre-suffixed value straight through.
    const suffix = fieldUnit(opt, f.key) === "years" ? "yr" : "mo";
    return `${trimmed} ${suffix}`;
  }
  const val = (raw || "").trim();
  if (!val) problems.push(`"${opt.label}": ${f.label} is required`);
  return val;
}

function buildPayload() {
  const problems = [];
  if (!state.property_address.trim()) problems.push("Property Address is required");
  if (!state.purchased_from.trim()) problems.push("Purchased From is required");
  if (!state.purchased_by.trim()) problems.push("Purchased By is required");

  const activeOptions = state.options.filter(o => o.on);
  if (activeOptions.length === 0) problems.push("At least one option must be turned on");

  const options = activeOptions.map((opt, i) => {
    const out = { label: opt.label.trim() || `Option ${i + 1}`, structure: opt.structure };
    STRUCTURE_FIELDS[opt.structure].forEach(f => { out[f.key] = resolveFieldValue(opt, f, problems); });
    if (opt.structure === "seller_carryback") {
      out.include_first_mortgage_terms = !!opt.includeFirstMortgageTerms;
      if (opt.includeFirstMortgageTerms) {
        FIRST_MORTGAGE_EXTRA_FIELDS.forEach(f => { out[f.key] = resolveFieldValue(opt, f, problems); });
        const calc = calcFirstMortgagePayment(opt);
        if (!calc) {
          problems.push(`"${opt.label}": First Mortgage Term is required to calculate the payment`);
          out.first_mortgage_payment = "N/A";
        } else {
          out.first_mortgage_payment = formatMoney(String(Math.round(calc.payment)));
        }
      }
    }
    if (opt.why.length) out.why_you_win = opt.why.slice();
    return out;
  });

  return { problems, payload: { property_address: state.property_address.trim(), purchased_from: state.purchased_from.trim(), purchased_by: state.purchased_by.trim(), options } };
}

document.getElementById("copyBtn").addEventListener("click", async () => {
  hideError();
  document.querySelectorAll(".err").forEach(el => el.classList.remove("err"));
  const { problems, payload } = buildPayload();
  if (problems.length) {
    showError(problems);
    return;
  }
  const json = JSON.stringify(payload, null, 2);
  let copied = false;
  try {
    await navigator.clipboard.writeText(json);
    copied = true;
  } catch (e) {}

  if (!copied) {
    let out = document.getElementById("jsonFallback");
    if (!out) {
      out = document.createElement("section");
      out.className = "block";
      out.id = "jsonFallback";
      out.innerHTML = `<p class="eyebrow">Copy manually</p><textarea class="json-out" readonly></textarea>`;
      document.querySelector("main").insertBefore(out, document.querySelector(".help-note"));
    }
    out.querySelector("textarea").value = json;
    out.scrollIntoView({ behavior: "smooth", block: "center" });
    out.querySelector("textarea").select();
  }

  const status = document.getElementById("statusText");
  status.textContent = copied ? "Copied ✓" : "See below";
  status.classList.add("show");
  setTimeout(() => status.classList.remove("show"), 2200);
});

function hideResult() {
  document.getElementById("resultBlock").classList.remove("show");
}
function showResult(slidesUrl, pdfUrl) {
  document.getElementById("slidesLink").href = slidesUrl;
  document.getElementById("pdfLink").href = pdfUrl;
  document.getElementById("resultBlock").classList.add("show");
  document.getElementById("resultBlock").scrollIntoView({ behavior: "smooth", block: "start" });
}

document.getElementById("sendBtn").addEventListener("click", async () => {
  hideError();
  hideResult();
  document.querySelectorAll(".err").forEach(el => el.classList.remove("err"));
  const { problems, payload } = buildPayload();
  if (problems.length) {
    showError(problems);
    return;
  }
  let pin = getPin();
  if (!pin) {
    pin = (prompt("Backend PIN (saved on this device only):") || "").trim();
    if (!pin) {
      showError(["A PIN is required to send to Drive. Use Copy JSON instead, or enter the PIN."]);
      return;
    }
    localStorage.setItem(PIN_STORAGE_KEY, pin);
  }

  const sendBtn = document.getElementById("sendBtn");
  const status = document.getElementById("statusText");
  sendBtn.disabled = true;
  status.textContent = "Sending…";
  status.classList.add("show");

  try {
    const resp = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Access-Pin": pin },
      body: JSON.stringify(payload),
    });
    if (resp.status === 401) {
      localStorage.removeItem(PIN_STORAGE_KEY);
      status.classList.remove("show");
      showError(["Wrong PIN — cleared, try Send again to re-enter it."]);
      return;
    }
    const result = await resp.json();
    if (result.ok) {
      status.textContent = "Sent ✓";
      showResult(result.slides_url, result.pdf_url);
    } else {
      status.classList.remove("show");
      showError([result.message || result.error || "Send failed — unknown error"]);
    }
  } catch (e) {
    status.classList.remove("show");
    showError(["Couldn't reach the backend — make sure Tailscale is on and connected, then try again. (" + e.message + ")"]);
  } finally {
    sendBtn.disabled = false;
    setTimeout(() => status.classList.remove("show"), 2200);
  }
});

document.getElementById("propertyAddress").value = state.property_address;
document.getElementById("purchasedFrom").value = state.purchased_from;
document.getElementById("purchasedBy").value = state.purchased_by;
renderOptions();
</script>
